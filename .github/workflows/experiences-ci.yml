name: experiences-ci

on:
  pull_request:
    paths:
      - 'experiences/**'
      - '.github/workflows/experiences-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'experiences/**'
      - '.github/workflows/experiences-ci.yml'

permissions:
  contents: read

concurrency:
  group: experiences-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: detect affected experiences
    runs-on: ubuntu-latest
    outputs:
      build_matrix: ${{ steps.matrix.outputs.build_matrix }}
      static_matrix: ${{ steps.matrix.outputs.static_matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build affected matrices
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess

          build = [
              {'name': 'speedmaster-38', 'path': 'experiences/01-speedmaster-38', 'output': '.next'},
              {'name': 'beoplay-h100', 'path': 'experiences/02-beoplay-h100', 'output': 'dist'},
              {'name': 'taycan-turbo-gt', 'path': 'experiences/03-taycan-turbo-gt', 'output': 'dist'},
              {'name': 'orpheon', 'path': 'experiences/04-orpheon', 'output': 'dist'},
              {'name': 'alphafly-3', 'path': 'experiences/05-alphafly-3', 'output': 'dist'},
          ]
          static = [
              {'name': 'linea-mini', 'path': 'experiences/06-linea-mini'},
              {'name': 'beosound-a9', 'path': 'experiences/07-beosound-a9'},
              {'name': 'rimowa-original', 'path': 'experiences/08-rimowa-original'},
              {'name': 'sony-a1ii', 'path': 'experiences/09-sony-a1ii'},
              {'name': 'garmin-fenix8pro', 'path': 'experiences/10-garmin-fenix8pro'},
          ]

          event = os.environ.get('EVENT_NAME', '')
          if event == 'pull_request':
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
          else:
              base = os.environ.get('BEFORE_SHA', '')
              head = os.environ['HEAD_SHA']

          all_zero = bool(base) and set(base) == {'0'}
          if not base or all_zero:
              changed = {'experiences/', '.github/workflows/experiences-ci.yml'}
          else:
              out = subprocess.check_output(
                  ['git', 'diff', '--name-only', base, head],
                  text=True,
              )
              changed = {line.strip() for line in out.splitlines() if line.strip()}

          workflow_changed = '.github/workflows/experiences-ci.yml' in changed

          def affected(items):
              if workflow_changed or 'experiences/' in changed:
                  return items
              return [
                  item for item in items
                  if any(path == item['path'] or path.startswith(item['path'] + '/') for path in changed)
              ]

          build_matrix = affected(build)
          static_matrix = affected(static)
          print('changed files:', *sorted(changed), sep='\n- ')
          print('build matrix:', json.dumps(build_matrix))
          print('static matrix:', json.dumps(static_matrix))

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write('build_matrix=' + json.dumps(build_matrix, separators=(',', ':')) + '\n')
              f.write('static_matrix=' + json.dumps(static_matrix, separators=(',', ':')) + '\n')
          PY

  build:
    name: build (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.build_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.build_matrix) }}

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Production build
        run: npm run build

      - name: Report build output
        shell: bash
        run: |
          if [ -d "${{ matrix.output }}" ]; then
            echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            du -sh "${{ matrix.output }}" >> "$GITHUB_STEP_SUMMARY"
            find "${{ matrix.output }}" -type f -printf '%s %p\n' 2>/dev/null | sort -nr | head -20 >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Expected output directory ${{ matrix.output }} was not created" >&2
            exit 1
          fi

  static-smoke:
    name: static smoke (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.static_matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.static_matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate HTML structure and accessibility basics
        env:
          SITE_DIR: ${{ matrix.path }}
        run: |
          python3 - <<'PY'
          import os
          from html.parser import HTMLParser
          from pathlib import Path

          site = Path(os.environ['SITE_DIR'])
          html_path = site / 'index.html'
          if not html_path.exists():
              raise SystemExit(f'Missing {html_path}')

          class Audit(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.img_missing_alt = []
                  self.links = 0
                  self.interactive = 0
                  self.scripts = []
                  self._in_script = False
                  self._script_parts = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if 'id' in attrs:
                      self.ids.append(attrs['id'])
                  if tag == 'img' and 'alt' not in attrs:
                      self.img_missing_alt.append(attrs.get('src','<unknown>'))
                  if tag == 'a': self.links += 1
                  if tag in {'button','input','select','textarea'}:
                      self.interactive += 1
                  if attrs.get('role') in {'button','slider','switch','tab'}:
                      self.interactive += 1
                  if tag == 'script' and 'src' not in attrs:
                      self._in_script = True
                      self._script_parts = []
              def handle_data(self, data):
                  if self._in_script:
                      self._script_parts.append(data)
              def handle_endtag(self, tag):
                  if tag == 'script' and self._in_script:
                      self.scripts.append(''.join(self._script_parts))
                      self._in_script = False

          text = html_path.read_text(encoding='utf-8')
          audit = Audit(); audit.feed(text)
          dupes = sorted({x for x in audit.ids if audit.ids.count(x) > 1})
          if dupes: raise SystemExit(f'Duplicate ids: {dupes}')
          if audit.img_missing_alt: raise SystemExit(f'Images missing alt: {audit.img_missing_alt}')
          if '<meta name="viewport"' not in text: raise SystemExit('Missing viewport meta')
          if 'prefers-reduced-motion' not in text: raise SystemExit('Missing reduced-motion treatment')
          if audit.links < 2: raise SystemExit('Expected meaningful navigation links')
          if audit.interactive < 1: raise SystemExit('Expected at least one meaningful interactive control')

          out = Path('/tmp/inline-script.js')
          out.write_text('\n'.join(audit.scripts), encoding='utf-8')
          print(f'{site.name}: ids={len(audit.ids)} links={audit.links} interactive={audit.interactive} scripts={len(audit.scripts)}')
          PY

      - name: Validate inline JavaScript syntax
        run: node --check /tmp/inline-script.js

      - name: Validate serverless API syntax
        env:
          SITE_DIR: ${{ matrix.path }}
        run: |
          node --check "$SITE_DIR/api/config.js"
          node --check "$SITE_DIR/api/telemetry.js"

      - name: Guard against accidental persistence claims
        env:
          SITE_DIR: ${{ matrix.path }}
        run: |
          grep -q "persisted:false" "$SITE_DIR/api/telemetry.js"
          ! grep -R -E "(STRIPE_SECRET|SUPABASE_SERVICE|DATABASE_URL|API_KEY=)" "$SITE_DIR" --exclude='README.md'
